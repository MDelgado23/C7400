# Spec 5.1 — live-audio-playback: the app autoplays on launch → live audio
# starts on its own, UI shows pause. (Audio output itself is verified manually /
# on a real device; here we assert the player reaches the playing state.)
appId: ar.com.lu32.radio
---
- launchApp
# The loading splash animates the logo (~1.8s) and then the app AUTOPLAYS the
# live stream, so playback reaches the playing state with NO manual tap. The
# background-playback notice may overlay the top of the Radio screen but does
# not block anything (covered in 05-background-playback-warning.yaml).
- extendedWaitUntil:
    visible: 'Pausar'
    timeout: 12000
