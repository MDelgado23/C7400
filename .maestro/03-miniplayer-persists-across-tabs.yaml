# Spec 5.3 — app-shell: switching tabs keeps audio + mini-player visible.
appId: ar.com.lu32.radio
---
- launchApp
# Autoplay after the loading splash — wait for the playing state, don't tap. The
# background-playback notice may overlay the top of the Radio screen but does not
# block the controls or the tab bar.
- extendedWaitUntil:
    visible: 'Pausar'
    timeout: 12000
- tapOn: 'Noticias'
# The mini-player (with its Pausar control) must remain visible on the Noticias tab.
- assertVisible: 'Pausar'
- assertVisible: 'LU32 en vivo'
