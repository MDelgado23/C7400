# Spec 5.4 — news-feed: open Noticias, tap an article, see the detail; the
# mini-player stays visible (audio unaffected).
appId: ar.com.lu32.radio
---
- launchApp
# Wait past the loading splash (autoplay starts the stream on its own) before
# navigating. The mini-player then persists across tabs.
- extendedWaitUntil:
    visible: 'LU32 en vivo'
    timeout: 12000
- tapOn: 'Noticias'
- extendedWaitUntil:
    visible:
      id: 'article-.*'
    timeout: 10000
- tapOn:
    id: 'article-.*'
    index: 0
# On the detail screen the persistent mini-player is still present.
- assertVisible: 'LU32 en vivo'
