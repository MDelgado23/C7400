# Spec 5.6 — background-playback warning (feat: harden background playback).
#
# When the app is NOT exempt from battery optimization, the Radio screen shows a
# notice with a one-tap fix. Tapping "Activar" MUST open the OS exemption dialog
# — this is exactly the path a missing REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
# manifest permission would silently break (the button would do nothing). This
# flow is the end-to-end regression guard for that class of bug: unit tests pass
# even when the native permission is absent, but this flow fails.
#
# PRECONDITION: the app must be non-exempt from battery optimization. That is the
# default on a fresh install. `clearState` resets app state but NOT the OS
# whitelist, so run this on a clean device / CI image — a device that already
# granted the exemption will not show the notice.
#
# LOCALE: the app and this device's system UI are Spanish (es-AR); the system
# dialog button labels ("Permitir" / "Denegar") are matched accordingly.
appId: ar.com.lu32.radio
---
- launchApp:
    clearState: true
# Android 13+: `clearState` revokes POST_NOTIFICATIONS, and initAudio requests it
# on every cold start, so the system notification dialog opens over the intro.
# It is not what this flow guards, so dismiss it first.
#
# Waited for explicitly rather than tapped straight away: the request only fires
# after loadRemoteConfig() resolves, which can take the full 4s FETCH_TIMEOUT_MS
# on a slow or dead network, so a bare tap can run before the dialog exists and
# leave it sitting over the intro. Both steps are optional — no dialog appears on
# Android 12 and below, nor once the grant sticks within a run.
- extendedWaitUntil:
    visible: 'Permitir'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Permitir'
    optional: true
# The animated intro plays first (~4.7s), then autoplay reveals the Radio screen
# with the notice. The BATTERY exemption is prompted ONLY by tapping "Activar"
# below — play() no longer auto-fires that dialog.
- extendedWaitUntil:
    visible: 'La radio puede cortarse en segundo plano'
    timeout: 12000
- tapOn: 'Activar'
# The system exemption dialog must appear. "Permitir" is a system-dialog button
# only (the in-app notice's only action is "Activar"), so matching it here
# unambiguously proves the intent fired and the manifest permission is present.
- extendedWaitUntil:
    visible: 'Permitir'
    timeout: 5000
# Decline to leave the app non-exempt, keeping this flow idempotent/re-runnable.
- tapOn: 'Denegar'
- assertVisible: 'La radio puede cortarse en segundo plano'
